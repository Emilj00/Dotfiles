# ==================
# Window Settings
# ==================
[window]
decorations = "full"
dynamic_title = true
opacity = 0.9

[window.padding]
x = 1
y = 1


# ==================
# Environment
# ==================
[env]
TERM = "xterm-256color"


# ==================
# General Settings
# ==================
[general]
import = ["./themes/themes/gruvbox_dark.toml"]


# ==================
# Font Configuration
# ==================
[font]
size = 12.0


# ==================
# Keyboard Shortcuts
# ==================
[[keyboard.bindings]]
key = "F"
mods = "Control|Shift"
action = "ReceiveChar"



# ==================
# Cursor
# ==================
[cursor]
smooth_motion = true

smooth_motion_factor = 0.65
smooth_motion_spring = 0.75

smooth_motion_max_stretch_x = 3.0
smooth_motion_max_stretch_y = 3.0

